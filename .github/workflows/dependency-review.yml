name: dependency-review
# Required check (see .github/rulesets/master.json). Split out of pr-gates.yml because it needs
# the PR's own commits, which pr-gates.yml (pull_request_target) must never check out.
on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:  # required check; its steps run only when dependency files change, otherwise it passes empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(requirements\.txt|pyproject\.toml|uv\.lock|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: steps.changed.outputs.run == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
