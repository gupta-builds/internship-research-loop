name: pr-gates
# Deterministic PR gates (scripts/ci/pr_gates.py): stdlib + gh, zero LLM.
# `pull_request_target`: GitHub runs THIS file and the checked-out gate script from the base
# branch (master), so a PR cannot edit the gate that judges it (Copilot review of #18, 2026-11-21).
# That is safe only because nothing here checks out PR code: the script reads the PR through
# the API / GITHUB_EVENT_PATH, and the `workflow_lint` gate rejects an explicit `ref:` checkout
# under this trigger. PR text is never interpolated into a `run:` script (reseed.yml fix e115db4).
# A change to this file or pr_gates.py takes effect only after it merges.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-gates:  # name must stay exactly `pr-gates`: the master ruleset requires this context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # no `ref:` on purpose: base branch, never the PR head
      - run: pip install pyyaml==6.0.3  # workflow_lint gate
      - run: python3 scripts/ci/pr_gates.py
        env:
          GH_TOKEN: ${{ github.token }}
